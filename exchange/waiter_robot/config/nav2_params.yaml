# Nav2 parameters for TIAGo (pmb2 base) in waiter_scene.world.
#
# The map is NOT given to the robot: there is no map_server and no static_layer,
# and both costmaps are built from the base laser as the robot moves. What the
# robot knows about the room's obstacles still comes entirely from perception.
#
# Localization, however, now comes from waiter_robot/gt_localization.py (the
# simulator's ground truth), NOT from slam_toolbox. This is a deliberate change
# of an earlier decision, and it is worth being explicit about: the bridge sends
# every goal in Gazebo WORLD coordinates on frame_id "map", which is only
# correct while the two frames coincide. With slam_toolbox they stopped
# coinciding -- measured on 2026-08-29 with the sim live and the robot standing
# still, "map" said (1.048, -0.602) while the world said (-2.000, 8.571): 9.2 m
# and 26.5 degrees apart, enough to send a goal aimed at the counter into the
# middle of the dining room. Scan matching drifts here because the base veers
# under software rendering (see gt_localization.py's own docstring) and the room
# is large and feature-poor.
#
# The honest alternative is to keep SLAM and express the goals in the map frame
# instead of world coordinates -- but computing that correspondence needs the
# ground truth anyway. If SLAM localization is a requirement of the assignment,
# this is the file (and docker/sim_supervisor.sh's launch_nav) to revisit.
#
# TIAGo specifics that are not optional:
#   * the base laser publishes on /scan_raw, NOT /scan
#   * wheel odometry is /mobile_base_controller/odom, not /odom
#   * the base frame is base_footprint
#   * robot_radius 0.28. Local inflation 0.32 so the robot can manoeuvre when
#     parked at a counter; global inflation 0.50 so long paths keep clear of
#     the tables instead of grazing them, which the controller cannot follow.
#
# Rates are set for a CPU-only host (measured real-time factor ~0.5). On a
# machine with a GPU they can go back up.

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /mobile_base_controller/odom
    bt_loop_duration: 50    # CPU: 100 Hz is unreachable on CPU -- the log fills with 'tick rate exceeded'
    default_server_timeout: 5000    # CPU: milliseconds -- the controller cannot ack a goal in 60ms under load
    wait_for_service_timeout: 15000
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0    # CPU: halved to what the CPU can deliver
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["precise_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 40.0

    # Arrival tolerance: 20 cm / ~17 deg. The old 5 cm / 3 deg was unreachable
    # for a differential base in a half-speed sim -- the robot parked ON the
    # goal and Nav2 never declared success, so every leg timed out as failed.
    precise_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.30
      stateful: true

    # DWB local planner tuned for a TIAGo differential base.
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.25    # CPU: slower, so a 10 Hz controller still corrects often enough per metre
      max_vel_y: 0.0
      max_vel_theta: 0.7    # CPU: as above
      min_speed_xy: 0.0
      max_speed_xy: 0.4
      min_speed_theta: 0.0
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 2.0
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -2.0
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.5
      xy_goal_tolerance: 0.20
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 2.0    # CPU: local costmap: 5x/s is wasted work at this frame rate
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.28
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_raw
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 20.0
          raytrace_min_range: 0.0
          obstacle_max_range: 12.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.32
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.28
      resolution: 0.05
      # Fixed bounds covering the whole bar, instead of inheriting the size of
      # the SLAM map. Early on that map is only as big as what the laser has
      # caught from the spawn point, so every table sits OUTSIDE the costmap and
      # the planner refuses with "failed to generate a valid path" -- never
      # having had a grid to search. The room spans about x[-6, 8], y[-6, 10].
      rolling_window: false
      width: 18
      height: 20
      origin_x: -8.0
      origin_y: -8.0
      # Unseen cells stay unknown rather than being assumed free, and the
      # planner may route through them (allow_unknown below): the robot plans
      # optimistically into unexplored space and the laser corrects it en route.
      track_unknown_space: true
      # No static_layer: it resizes the costmap to whatever map arrives, which
      # is the behaviour being avoided. slam_toolbox still localises -- it
      # provides map->odom -- but the costmap is built from live laser
      # observations, which accumulate because this grid does not roll.
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_raw
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 20.0
          raytrace_min_range: 0.0
          obstacle_max_range: 12.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.50
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0    # CPU: stops the planner warning on every cycle it cannot meet
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.4, 0.0, 1.0]
    min_velocity: [-0.4, 0.0, -1.0]
    max_accel: [1.0, 0.0, 2.0]
    max_decel: [-1.0, 0.0, -2.0]
    odom_topic: "/mobile_base_controller/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200
